plugins {
	id 'horsestats.loader'
	id 'net.fabricmc.fabric-loom'
}

loom {
	mods {
		"horsestatsvanilla" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
	api("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
	api include("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}")
}

publishMods {
	modLoaders.addAll("fabric", "quilt")
	curseforge {
		requires("fabric-api")
		optional("modmenu")
	}
	modrinth {
		requires("fabric-api")
		optional("modmenu")
	}
}
