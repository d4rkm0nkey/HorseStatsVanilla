plugins {
	id 'horsestats.loader'
	id 'net.neoforged.moddev'
}

neoForge {
	version = neoforge_version
	runs {
		client {
			client()
		}
	}
	mods {
		"horsestatsvanilla" {
			sourceSet sourceSets.main
		}
	}
}

// Mods that are only on the classpath of the runs, not dependencies of the published jar
configurations {
	localRuntime
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	// Optional: only the options screen uses it
	localRuntime "me.shedaniel.cloth:cloth-config-neoforge:${cloth_version}"
}

publishMods {
	modLoaders.add("neoforge")
	curseforge {
		optional("cloth-config")
	}
	modrinth {
		optional("cloth-config")
	}
	// A mod built against a NeoForge beta is not published as a stable release
	if (neoforge_version.contains("beta")) {
		type = BETA
	}
}
