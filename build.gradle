plugins {
	id 'fabric-loom' version '1.11.8'
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    // The CottonMC maven (server.bbkr.space) is offline, so LibGui is fetched from its GitHub releases.
    ivy {
        name = "LibGui GitHub Releases"
        url = "https://github.com/CottonMC/LibGui/releases/download/"
        patternLayout {
            artifact "${project.libgui_tag}/[module]-[revision].[ext]"
        }
        metadataSources { artifact() }
        content { includeModule("io.github.cottonmc", "LibGui") }
    }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "horsestatsvanilla" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modApi("com.terraformersmc:modmenu:9.2.0") { transitive = false }
	modImplementation include("io.github.cottonmc:LibGui:${project.libgui_version}")
	modApi include ("me.shedaniel.cloth:cloth-config-fabric:13.0.138")
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dependency", project.minecraft_dependency
	inputs.property "java_version", project.java_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
			"minecraft_dependency": project.minecraft_dependency,
			"java_version": project.java_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as int
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Publishing to CurseForge and Modrinth: ./gradlew publishMods
// Without CURSEFORGE_TOKEN / MODRINTH_TOKEN set this runs as a dry run.
def publishVersions = project.publish_minecraft_versions.split(",").collect { it.trim() }

publishMods {
	file = remapJar.archiveFile
	displayName = "${project.mod_version} for ${publishVersions.first()}" + (publishVersions.size() > 1 ? "-${publishVersions.last()}" : "")
	version = project.version
	changelog = providers.environmentVariable("CHANGELOG").filter { !it.isBlank() }.orElse("See https://github.com/d4rkm0nkey/HorseStatsVanilla/releases")
	type = providers.environmentVariable("RELEASE_TYPE").filter { !it.isBlank() }.map { me.modmuss50.mpp.ReleaseType.of(it) }.orElse(STABLE)
	modLoaders.addAll("fabric", "quilt")
	dryRun = providers.environmentVariable("CURSEFORGE_TOKEN").getOrNull() == null \
		|| providers.environmentVariable("MODRINTH_TOKEN").getOrNull() == null

	curseforge {
		projectId = project.curseforge_id
		projectSlug = "horsestatsvanilla"
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		minecraftVersions.addAll(publishVersions)
		javaVersions.add(JavaVersion.toVersion(project.java_version))
		client = true
		server = false
		requires("fabric-api")
		optional("modmenu")
	}
	modrinth {
		projectId = project.modrinth_id
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		minecraftVersions.addAll(publishVersions)
		requires("fabric-api")
		optional("modmenu")
	}
}
