# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Java version required by this Minecraft version (also used by the CI workflows)
java_version=25

minecraft_version=26.1.2

# Fabric, check these on https://fabricmc.net/develop
loader_version=0.19.5
fabric_version=0.155.3+26.1.2
modmenu_version=18.0.2

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.1.2.114
# Vanilla Minecraft for the common project, see https://projects.neoforged.net/neoforged/neoform
neoform_version=26.1.2-1

# Shared dependencies
cloth_version=26.1.154
basic_math_version=0.6.1
mixin_version=0.17.4+mixin.0.8.7

# Mod Properties
mod_version=4.5.1
maven_group=monkey.lumpy
archives_base_name=horse-stats-vanilla


# Publishing (./gradlew publishMods)
# Comma-separated Minecraft versions this build is uploaded for
publish_minecraft_versions=26.1,26.1.1,26.1.2
# Minecraft version range for fabric.mod.json and neoforge.mods.toml
minecraft_dependency=>=26.1 <26.2
minecraft_range=[26.1,26.2)
curseforge_id=351393
modrinth_id=l4qoXLzx
