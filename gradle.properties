# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Java version required by this Minecraft version (also used by the CI workflows)
java_version=17

# Fabric Properties
# check these on https://fabricmc.net/use
minecraft_version=1.20.2
yarn_mappings=1.20.2+build.4
loader_version=0.14.24

#Fabric api
fabric_version=0.90.4+1.20.2

# Mod Properties
mod_version=4.5.0
maven_group=monkey.lumpy
archives_base_name=horse-stats-vanilla

# LibGui: libgui_tag is the GitHub release tag, libgui_version the jar version
libgui_tag=9.0.0
libgui_version=9.0.0+1.20.2

# Publishing (./gradlew publishMods)
# Comma-separated Minecraft versions this build is uploaded for
publish_minecraft_versions=1.20.2
curseforge_id=351393
modrinth_id=l4qoXLzx
