# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Java version required by this Minecraft version (also used by the CI workflows)
java_version=21

# Fabric Properties
# check these on https://fabricmc.net/use
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5

#Fabric api
fabric_version=0.141.6+1.21.11

# Mod Properties
mod_version=4.5.1
maven_group=monkey.lumpy
archives_base_name=horse-stats-vanilla

# LibGui: libgui_tag is the GitHub release tag, libgui_version the jar version
libgui_tag=15.1.0
libgui_version=15.1.0+1.21.11

# Publishing (./gradlew publishMods)
# Comma-separated Minecraft versions this build is uploaded for
publish_minecraft_versions=1.21.11
# Minecraft version range written into fabric.mod.json
minecraft_dependency=1.21.11
curseforge_id=351393
modrinth_id=l4qoXLzx
