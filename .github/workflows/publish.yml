# Builds the checked-out branch and publishes it to CurseForge and Modrinth.
# The Minecraft versions, Java version and project IDs come from gradle.properties,
# so the same workflow works on every version branch.
#
# Triggers:
#  - publishing a GitHub release (changelog = release notes, pre-release = beta)
#  - manually via "Run workflow" (pick the branch, release type and changelog)

name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        type: choice
        options: [stable, beta, alpha]
        default: stable
      changelog:
        description: 'Changelog (Markdown)'
        type: string
        required: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: read java version
        id: props
        # Loom needs at least Java 21 to run, the mod itself targets java_version
        run: |
          java=$(grep '^java_version=' gradle.properties | cut -d= -f2)
          echo "java=$(( java > 21 ? java : 21 ))" >> "$GITHUB_OUTPUT"
      - name: setup jdk ${{ steps.props.outputs.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.props.outputs.java }}
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: verify jar contents
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -1)
          unzip -l "$jar" | grep -q 'fabric.mod.json' || { echo "::error::$jar contains no fabric.mod.json"; exit 1; }
      - name: publish
        run: ./gradlew publishMods
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_TYPE: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'beta' || 'stable') || inputs.release_type }}
          CHANGELOG: ${{ github.event_name == 'release' && github.event.release.body || inputs.changelog }}
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
