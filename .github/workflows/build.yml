# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        # run on both Linux and Windows
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: read java version
        id: props
        shell: bash
        # Loom needs at least Java 21 to run, the mod itself targets java_version
        run: |
          java=$(grep '^java_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "java=$(( java > 21 ? java : 21 ))" >> "$GITHUB_OUTPUT"
      - name: setup jdk ${{ steps.props.outputs.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.props.outputs.java }}
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: install software vulkan
        if: ${{ runner.os == 'Linux' }}
        # 26.3 finds no OpenGL visual on xvfb; Mesa's lavapipe gives it a Vulkan device instead
        run: sudo apt-get update -q && sudo apt-get install -yq mesa-vulkan-drivers libvulkan1
      - name: client game tests
        if: ${{ runner.os == 'Linux' }}
        # The game hangs instead of failing when it finds no graphics backend
        timeout-minutes: 20
        # Starts the game in a virtual display, see fabric/build.gradle. It needs
        # 24 bit colors: xvfb-run's default of 8 bit offers no OpenGL visual
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :fabric:runClientGameTest
      - name: capture game test screenshots
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: Screenshots
          path: fabric/build/run/clientGameTest/screenshots/
      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' }} # Only upload artifacts built on one OS
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            neoforge/build/libs/
