// Settings for the loader projects (fabric, neoforge): compiles the common sources into
// the loader jar and configures publishing to CurseForge and Modrinth.
plugins {
	id 'horsestats.common'
	id 'me.modmuss50.mod-publish-plugin'
}

base {
	archivesName = "${archives_base_name}-${project.name}"
}

def common = project(':common')
sourceSets.main.java.srcDir(common.file('src/main/java'))
sourceSets.main.resources.srcDir(common.file('src/main/resources'))

dependencies {
	// Cloth Config's loader-independent API, used by the common sources
	compileOnly("me.shedaniel.cloth:basic-math:${basic_math_version}")
}

processResources {
	def props = [
		"version"             : project.version,
		"minecraft_dependency": minecraft_dependency,
		"minecraft_range"     : minecraft_range,
		"java_version"        : java_version,
	]
	inputs.properties(props)
	filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml"]) {
		expand props
	}
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${archives_base_name}" }
	}
}

// Publishing to CurseForge and Modrinth: ./gradlew publishMods
// Without CURSEFORGE_TOKEN / MODRINTH_TOKEN set this runs as a dry run.
def publishVersions = publish_minecraft_versions.split(",").collect { it.trim() }
def loaderName = project.name == "neoforge" ? "NeoForge" : "Fabric"

publishMods {
	file = jar.archiveFile
	displayName = "${mod_version} for ${publishVersions.first()}" + (publishVersions.size() > 1 ? "-${publishVersions.last()}" : "") + " (${loaderName})"
	version = "${project.version}-${project.name}"
	changelog = providers.environmentVariable("CHANGELOG").filter { !it.isBlank() }.orElse("See https://github.com/d4rkm0nkey/HorseStatsVanilla/releases")
	type = providers.environmentVariable("RELEASE_TYPE").filter { !it.isBlank() }.map { me.modmuss50.mpp.ReleaseType.of(it) }.orElse(STABLE)
	dryRun = providers.environmentVariable("CURSEFORGE_TOKEN").getOrElse("").isBlank() \
		|| providers.environmentVariable("MODRINTH_TOKEN").getOrElse("").isBlank()

	curseforge {
		projectId = curseforge_id
		projectSlug = "horsestatsvanilla"
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		minecraftVersions.addAll(publishVersions)
		javaVersions.add(JavaVersion.toVersion(java_version))
		client = true
		server = false
	}
	modrinth {
		projectId = modrinth_id
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		minecraftVersions.addAll(publishVersions)
	}
}
